name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ems_backend
            -Dsonar.organization=your-org

      - name: Run StyleCop Analysis
        run: dotnet build --configuration Release /p:StyleCopEnabled=true

      - name: Run Security Scan
        uses: microsoft/security-devops-action@preview
        id: securitydevops
        with:
          categories: 'security,code-quality'

      - name: Build Report
        if: always()
        uses: microsoft/security-devops-action@preview
        with:
          results-dir: ${{ steps.securitydevops.outputs.results-dir }}
          results-sarif-dir: sarif
          categories: 'security,code-quality'
          publish: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: sarif
          wait-for-processing: true

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '? Code quality checks completed. Check SonarCloud and Security DevOps reports above.'
            })
