name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AZURE_RESOURCE_GROUP: ems-prod-rg
  AZURE_CONTAINER_GROUP: ems-prod-aci

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        uses: azure/aci-deploy-action@v1
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          name: ${{ env.AZURE_CONTAINER_GROUP }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          registry-login-server: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          environment-variables: |
            ConnectionStrings__DefaultConnection=${{ secrets.PROD_DATABASE_CONNECTION_STRING }}
            ConnectionStrings__Redis=${{ secrets.PROD_REDIS_CONNECTION_STRING }}
            ASPNETCORE_ENVIRONMENT=Production
            JwtSettings__SecretKey=${{ secrets.JWT_SECRET_KEY }}
          ports: 5000 5000
          protocol: TCP

      - name: Health Check
        run: |
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -f http://${{ env.AZURE_CONTAINER_GROUP }}.westus.azurecontainer.io:5000/health; then
              echo "Service is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - Waiting..."
            sleep 10
          done
          echo "Service health check failed!"
          exit 1

      - name: Run Smoke Tests
        run: |
          dotnet test EMS.Tests/EMS.Tests.csproj \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --filter "Category=Smoke"
        env:
          TEST_API_URL: "http://${{ env.AZURE_CONTAINER_GROUP }}.westus.azurecontainer.io:5000"

      - name: Notify Production Deployment
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "?? Production Deployment Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*?? Production Deployment Complete*\nVersion: ${{ github.ref }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
