version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ems-sqlserver
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ems-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourPassword123! -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ems-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EMS API Application
  ems-api:
    build:
      context: .
      dockerfile: EMS.Api/Dockerfile
    container_name: ems-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EMS_DB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: "Development"
      JwtSettings__SecretKey: "your-super-secret-jwt-key-change-this-in-production-at-least-32-chars"
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:

networks:
  ems-network:
    driver: bridge
